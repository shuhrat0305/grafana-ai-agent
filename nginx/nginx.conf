# Serves Grafana with the chat overlay injected, and proxies the chat's API to
# the agent backend. Rule 1: a broken agent must never break the dashboard, so nothing
# on the `/` path depends on the overlay bundle or the agent backend being reachable.
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;
  error_log     /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_max_body_size 50m;

  upstream grafana { server 127.0.0.1:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name _;

    # The chat bundle, served from the mounted file. If it 404s the dashboard is
    # unaffected.
    location = /agent/overlay.js {
      alias /etc/nginx/agent/overlay.js;
      types { } default_type application/javascript;
      add_header Cache-Control "no-cache";
    }

    # Chat API -> the agent backend. Kept separate so the dashboard never depends on it.
    location /agent/api/ {
      rewrite ^/agent/api/(.*)$ /api/$1 break;
      proxy_pass http://127.0.0.1:8085;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Server-sent events: stream, do not buffer.
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Grafana Live websocket, untouched.
    location /api/live/ {
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Everything else is Grafana, with the overlay injected into HTML only.
    location / {
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # sub_filter cannot rewrite a compressed body, so ask for plain text.
      proxy_set_header Accept-Encoding "";
      sub_filter_once on;
      sub_filter '</body>' '<script src="/agent/overlay.js" defer></script></body>';
    }
  }
}
