# Dashboard provisioning for the local stack.
#
# allowUiUpdates is true so you can edit panels in the browser to try something
# out. Those edits are not persisted back to the JSON file: Grafana reloads from
# disk every updateIntervalSeconds, so anything worth keeping must be exported
# and written into dashboards/data-generator.json.
apiVersion: 1

providers:
  - name: demo
    orgId: 1
    folder: Demo
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Not /var/lib/grafana/dashboards: that tree is a named volume in compose.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
