# Minimal Prometheus so the local Grafana has a datasource that answers.
#
# Targets are on 127.0.0.1 because every container in this stack shares the
# Grafana network namespace.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Grafana exposes its own metrics unauthenticated on /metrics, which gives the
  # agent something non-trivial to query: HTTP request rates, response codes and
  # durations, all with real labels.
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:3000"]

  # Synthetic metrics from prometheus-data-generator. The local dashboard is built
  # on these series. Note the trailing slash: the generator serves /metrics/, and
  # a request to /metrics would only 308-redirect there. Scraped every 10s so a
  # freshly started stack fills a graph sooner.
  - job_name: data-generator
    metrics_path: /metrics/
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:9000"]
