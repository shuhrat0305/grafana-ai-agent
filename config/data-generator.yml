# Synthetic metrics for the local Grafana dashboard, generated by
# little-angry-clouds/prometheus-data-generator.
#
# How it behaves (from the tool's source): each metric runs in its own thread
# that walks its `sequence` top to bottom, then loops forever. A step runs for
# `eval_time` seconds, applying its operation every `interval` seconds. `value`
# is fixed; `values: a-b` picks a random number in [a,b] (float if it contains a
# dot, else int). Counters only add; gauges need an `operation` (inc/dec/set);
# histograms observe the value. Steps are sequential, so eval_time is kept short
# (2-4s) — the thread cycles through every label set within a few seconds, which
# keeps all series live for rate() and the gauges refreshed.
config:
  # HTTP throughput by endpoint + status. Counter -> graph with rate().
  # /api/checkout carries a small stream of 500s; /api/products a few 404s.
  - name: http_requests_total
    description: Total HTTP requests handled, by endpoint and status.
    type: counter
    labels: [endpoint, status]
    sequence:
      - eval_time: 3
        interval: 1
        values: 4-12
        labels: {endpoint: /, status: "200"}
      - eval_time: 3
        interval: 1
        values: 6-16
        labels: {endpoint: /api/products, status: "200"}
      - eval_time: 3
        interval: 1
        values: 3-9
        labels: {endpoint: /api/checkout, status: "200"}
      - eval_time: 3
        interval: 1
        values: 0-2
        labels: {endpoint: /api/checkout, status: "500"}
      - eval_time: 3
        interval: 1
        values: 0-2
        labels: {endpoint: /api/products, status: "404"}

  # Request latency per endpoint. Histogram -> p50/p95 via histogram_quantile.
  # /api/checkout is deliberately an order of magnitude slower than the rest.
  - name: http_request_duration_seconds
    description: HTTP request latency in seconds, by endpoint.
    type: histogram
    labels: [endpoint]
    sequence:
      - eval_time: 3
        interval: 1
        values: 0.02-0.25
        labels: {endpoint: /}
      - eval_time: 3
        interval: 1
        values: 0.05-0.4
        labels: {endpoint: /api/products}
      - eval_time: 3
        interval: 1
        values: 0.4-2.8
        labels: {endpoint: /api/checkout}

  # Concurrent users per region. Gauge -> set to a fresh random value each tick.
  - name: active_users
    description: Currently active users, by region.
    type: gauge
    labels: [region]
    sequence:
      - eval_time: 4
        interval: 2
        values: 200-900
        operation: set
        labels: {region: eu}
      - eval_time: 4
        interval: 2
        values: 300-1200
        operation: set
        labels: {region: us}
      - eval_time: 4
        interval: 2
        values: 80-400
        operation: set
        labels: {region: asia}

  # Background worker queue depth. Gauge -> wanders with inc/dec.
  - name: queue_length
    description: Pending jobs in each worker queue.
    type: gauge
    labels: [worker]
    sequence:
      - eval_time: 3
        interval: 1
        values: 0-6
        operation: inc
        labels: {worker: emails}
      - eval_time: 3
        interval: 1
        values: 0-5
        operation: dec
        labels: {worker: emails}
      - eval_time: 3
        interval: 1
        values: 0-8
        operation: inc
        labels: {worker: thumbnails}
      - eval_time: 3
        interval: 1
        values: 0-7
        operation: dec
        labels: {worker: thumbnails}

  # CPU load percentage per host. Gauge -> set 10-95%.
  - name: cpu_load_percent
    description: CPU load percentage, by host.
    type: gauge
    labels: [host]
    sequence:
      - eval_time: 4
        interval: 2
        values: 10-70
        operation: set
        labels: {host: web-01}
      - eval_time: 4
        interval: 2
        values: 20-95
        operation: set
        labels: {host: web-02}
      - eval_time: 4
        interval: 2
        values: 5-45
        operation: set
        labels: {host: worker-01}
